<title>TransNexus — Data Analysis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--card:#1a2235;--border:#2a3652;--text:#e8edf5;--muted:#6b7a99;--blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--accent:#60a5fa;--china:#ff4444;--hover:#1f2d47}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
.logo-name{font-size:1rem;font-weight:700}.logo-name span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:10px}
.hbadge{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:var(--accent);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.htitle{font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:.5px}
.layout{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:280px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stab{flex:1;padding:10px 0;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.stab.active{color:var(--accent);border-bottom-color:var(--blue);background:rgba(59,130,246,.05)}
.sidebar-inner{flex:1;overflow-y:auto;padding:12px}
.sidebar-inner::-webkit-scrollbar{width:3px}
.sidebar-inner::-webkit-scrollbar-thumb{background:#333}
.filter-group{margin-bottom:14px}
.fg-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.fld{margin-bottom:6px}
.fld label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:3px}
.fld input,.fld select{width:100%;background:#0d1525;border:1px solid var(--border);border-radius:5px;padding:6px 9px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .15s}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.fld input::placeholder{color:#3a4a6a}
.fld select option{background:#0d1525}
.btn-query{width:100%;background:linear-gradient(135deg,#1d4ed8,var(--blue));color:#fff;border:none;border-radius:6px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-query:hover{opacity:.88}
.btn-clear-f{width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:7px;font-size:12px;cursor:pointer;margin-top:4px;transition:border-color .15s}
.btn-clear-f:hover{border-color:var(--accent);color:var(--accent)}
/* MAIN */
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.results-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(10,14,26,.8)}
.res-count{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.res-count strong{color:var(--text);font-size:14px}
.flag-summary{display:flex;gap:8px}
.fsumm{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.fsumm.china{background:rgba(255,68,68,.15);color:#ff8080;border:1px solid rgba(255,68,68,.3)}
.fsumm.foci{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.res-actions{display:flex;gap:6px}
.btn-sm{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
/* TABLE */
.table-wrap{flex:1;overflow:auto}
.table-wrap::-webkit-scrollbar{width:4px;height:4px}
.table-wrap::-webkit-scrollbar-thumb{background:#333}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:2}
th{background:#0f1a2e;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px 11px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
th.sorted{color:var(--accent)}
td{padding:8px 11px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;vertical-align:middle}
tr.china-rec td{background:rgba(255,0,0,.05)}
tr.china-rec td:first-child{border-left:2px solid var(--china)}
tr.foci-rec td{background:rgba(239,68,68,.04)}
tr.foci-rec td:first-child{border-left:2px solid var(--red)}
tr:hover td{background:var(--hover);cursor:pointer}
tr.selected td{background:rgba(59,130,246,.1)}
tr.selected td:first-child{border-left:2px solid var(--blue)}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px}
.badge.pass{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge.warn{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
.badge.fail{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.badge.china{background:rgba(255,68,68,.15);color:#ff8080;border:1px solid rgba(255,68,68,.35)}
.badge.neutral{background:rgba(107,122,153,.1);color:var(--muted);border:1px solid var(--border)}
/* DETAIL PANEL */
.detail-panel{width:340px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
.detail-panel.open{display:flex}
.dp-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:linear-gradient(135deg,#1e3a5f,#162d4a)}
.dp-title{font-size:13px;font-weight:700;color:var(--accent)}
.dp-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.dp-close:hover{color:var(--text)}
.dp-body{flex:1;overflow-y:auto;padding:14px}
.dp-body::-webkit-scrollbar{width:3px}
.dp-body::-webkit-scrollbar-thumb{background:#333}
.dp-section{margin-bottom:14px}
.dp-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.dp-section-title.ind{color:var(--accent)}
.dp-section-title.flag{color:#ff8080}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.kv:last-child{border:none}
.kv-k{color:var(--muted);flex-shrink:0}
.kv-v{text-align:right;color:var(--text)}
.kv-v.china{color:#ff8080;font-weight:600}
.kv-v.flag{color:var(--red)}
.kv-v.ok{color:var(--green)}
.no-results{padding:48px;text-align:center;color:var(--muted)}
.no-results .nr-icon{font-size:36px;margin-bottom:12px}
.no-results .nr-txt{font-size:14px}
</style>

// ── FILTER LOGIC ──────────────────────────────
function matchInd(r,f){
  if(f.first&&!r.first.toLowerCase().includes(f.first.toLowerCase()))return false;
  if(f.last&&!r.last.toLowerCase().includes(f.last.toLowerCase()))return false;
  if(f.ssn&&!r.ssn.includes(f.ssn))return false;
  if(f.gender&&r.gender!==f.gender)return false;
  if(f.dob_from&&r.dob<f.dob_from)return false;
  if(f.dob_to&&r.dob>f.dob_to)return false;
  if(f.city&&!r.city.toLowerCase().includes(f.city.toLowerCase()))return false;
  if(f.state&&!r.state.toLowerCase().includes(f.state.toLowerCase()))return false;
  if(f.zip&&!r.zip.includes(f.zip))return false;
  if(f.phone&&!r.phone.includes(f.phone))return false;
  if(f.email&&!r.email.toLowerCase().includes(f.email.toLowerCase()))return false;
  if(f.employer&&!r.employer.toLowerCase().includes(f.employer.toLowerCase()))return false;
  if(f.income&&r.income!==f.income)return false;
  if(f.clearance&&!r.clearance.toLowerCase().includes(f.clearance.toLowerCase()))return false;
  if(f.score_min&&r.score<parseInt(f.score_min))return false;
  if(f.score_max&&r.score>parseInt(f.score_max))return false;
  if(f.debt_max&&r.debt>parseInt(f.debt_max))return false;
  if(f.derogs==='yes'&&r.derogs===0)return false;
  if(f.derogs==='no'&&r.derogs>0)return false;
  if(f.foreignConn==='yes'&&!r.foreignConn)return false;
  if(f.foreignConn==='no'&&r.foreignConn)return false;
  if(f.countries&&!r.countries.toUpperCase().includes(f.countries.toUpperCase()))return false;
  if(f.fociFlag==='yes'&&!r.fociFlag)return false;
  if(f.fociFlag==='no'&&r.fociFlag)return false;
  if(f.chinaFlag==='yes'&&!r.chinaFlag)return false;
  if(f.chinaFlag==='no'&&r.chinaFlag)return false;
  if(f.travel==='yes'&&!r.travel)return false;
  if(f.travel==='no'&&r.travel)return false;
  return true;
}
function matchCo(r,f){
  if(f.name&&!r.name.toLowerCase().includes(f.name.toLowerCase()))return false;
  if(f.ein&&!r.ein.includes(f.ein))return false;
  if(f.duns&&!r.duns.includes(f.duns))return false;
  if(f.sic&&!r.sic.includes(f.sic))return false;
  if(f.industry&&!r.industry.toLowerCase().includes(f.industry.toLowerCase()))return false;
  if(f.city&&!r.city.toLowerCase().includes(f.city.toLowerCase()))return false;
  if(f.state&&!r.state.toLowerCase().includes(f.state.toLowerCase()))return false;
  if(f.zip&&!r.zip.includes(f.zip))return false;
  if(f.founded_from&&parseInt(r.founded)<parseInt(f.founded_from))return false;
  if(f.founded_to&&parseInt(r.founded)>parseInt(f.founded_to))return false;
  if(f.revenue&&r.revenue!==f.revenue)return false;
  if(f.employees&&r.employees!==f.employees)return false;
  if(f.clearance&&!r.clearance.toLowerCase().includes(f.clearance.toLowerCase()))return false;
  if(f.bscore_min&&r.bscore<parseInt(f.bscore_min))return false;
  if(f.debt_max&&r.debt>parseInt(f.debt_max))return false;
  if(f.ucc==='yes'&&r.uccLiens===0)return false;
  if(f.ucc==='no'&&r.uccLiens>0)return false;
  if(f.foreignDebt==='yes'&&!r.foreignDebt)return false;
  if(f.foreignDebt==='no'&&r.foreignDebt)return false;
  if(f.foreignCountries&&!r.foreignCountries.toUpperCase().includes(f.foreignCountries.toUpperCase()))return false;
  if(f.prcConn==='yes'&&!r.prcConn)return false;
  if(f.prcConn==='no'&&r.prcConn)return false;
  if(f.shellFlag==='yes'&&!r.shellFlag)return false;
  if(f.shellFlag==='no'&&r.shellFlag)return false;
  return true;
}

// ── QUERY + RENDER TABLE ──────────────────────
var currentResults=[];
function runQuery(){
  var f=getFilters();
  var data=currentTab==='ind'?IND_DATA:CO_DATA;
  var fn=currentTab==='ind'?matchInd:matchCo;
  currentResults=data.filter(function(r){return fn(r,f);});
  if(sortCol){
    currentResults.sort(function(a,b){
      var av=a[sortCol],bv=b[sortCol];
      if(typeof av==='string')av=av.toLowerCase();
      if(typeof bv==='string')bv=bv.toLowerCase();
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
  }
  renderTable();
}

  var r=currentResults;
  document.getElementById('res-num').textContent=r.length;
  var chinaCount=r.filter(function(x){return x.chinaFlag||x.prcConn;}).length;

    html+='<div class="dp-section"><div class="dp-section-title '+(rec.prcConn||rec.shellFlag?'flag':'ind')+'">FOREIGN / FOCI</div>'+kv('Foreign Debt',rec.foreignDebt?'Yes':'No',rec.foreignDebt?'flag':'ok')+kv('Countries',rec.foreignCountries||'None',rec.foreignCountries.includes('CN')?'china':'')+kv('PRC Connection',rec.prcConn?'🇨🇳 YES':'No',rec.prcConn?'china':'ok')+kv('Shell Flag',rec.shellFlag?'⚠ YES':'No',rec.shellFlag?'flag':'ok')+'</div>';
    html+='<div class="dp-section"><div class="dp-section-title">NOTES</div><div style="font-size:12px;color:'+(rec.prcConn?'#ffb0b0':'var(--muted)')+';line-height:1.5;padding:6px 0">'+rec.notes+'</div></div>';
  }
  document.getElementById('dp-body').innerHTML=html;
}

function closeDetail(){selectedId=null;document.getElementById('detail-panel').className='detail-panel';renderTable();}

// ── EXPORT CSV ────────────────────────────────
function exportCSV(){
  if(!currentResults.length)return;
  var rows=[Object.keys(currentResults[0]).join(',')];
  currentResults.forEach(function(r){rows.push(Object.values(r).map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(','));});
  var csv=rows.join('
');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='tu-analysis-'+(currentTab==='ind'?'individual':'company')+'-'+Date.now()+'.csv';a.click();
}
